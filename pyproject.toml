[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luogubench"
version = "0.3.0"
description = "A small, auditable Luogu difficulty agreement benchmark"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
luogubench = "luogubench.cli:main"

[tool.setuptools]
packages = ["luogubench"]
